services:
  mailbackup:
    image: ghcr.io/chad3814/imap-backup:latest
    build: .
    container_name: mailbackup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The password itself is never in the environment; only its path is.
      IMAP_PASSWORD_FILE: /run/secrets/imap_password
      DATA_DIR: /data
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-300}
    secrets:
      - imap_password
    volumes:
      - mailbackup-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "mailbackup", "health", "--max-age", "900"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    stop_grace_period: 30s

volumes:
  mailbackup-data:

secrets:
  imap_password:
    file: ./secrets/imap_password.txt
